aid: boardy
name: Boardy
description: 'Boardy is an AI networking agent — an "AI Superconnector" that facilitates
  meaningful professional introductions. Users message Boardy (via chat and voice) to
  describe who they want to meet, and it matches them with relevant people from its
  network, sharing contact details only after both parties explicitly opt in to connect.
  Boardy is a free consumer product backed by Creandum; it uses public LinkedIn profile
  information to facilitate introductions and documents its data handling in a GDPR-aligned
  privacy policy and terms of service. Boardy publishes no public developer API, SDKs,
  or OpenAPI at this time — its public surface is a marketing site, legal pages, and an
  llms.txt for AI agents.'
